<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" role="img" aria-label="nastro-rs">
  <title>nastro-rs</title>
  <!-- terminal window -->
  <rect x="30" y="24" width="260" height="158" rx="22" fill="none" stroke="#64748b" stroke-width="9"/>
  <line x1="30" y1="64" x2="290" y2="64" stroke="#64748b" stroke-width="6"/>
  <g fill="#64748b">
    <circle cx="58" cy="44" r="5.5"/>
    <circle cx="78" cy="44" r="5.5"/>
    <circle cx="98" cy="44" r="5.5"/>
  </g>
  <!-- prompt chevron -->
  <path d="M62 102 L90 124 L62 146" fill="none" stroke="#14b8a6" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sound waveform -->
  <g stroke="#14b8a6" stroke-width="12" stroke-linecap="round">
    <line x1="124" y1="112" x2="124" y2="136"/>
    <line x1="146" y1="98"  x2="146" y2="150"/>
    <line x1="168" y1="84"  x2="168" y2="164"/>
    <line x1="190" y1="102" x2="190" y2="146"/>
    <line x1="212" y1="90"  x2="212" y2="158"/>
    <line x1="234" y1="108" x2="234" y2="140"/>
    <line x1="256" y1="116" x2="256" y2="132"/>
  </g>
  <!-- wordmark -->
  <text x="160" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="40" font-weight="700" letter-spacing="4" fill="#64748b">nastro<tspan fill="#14b8a6">-rs</tspan></text>
</svg>
