  <!-- wordmark -->
  <text x="160" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="42" font-weight="700" letter-spacing="6" fill="#94a3b8">nastro</text>
</svg>
