<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" role="img" aria-label="nastro">
  <title>nastro</title>
  <!-- cassette body -->
  <rect x="28" y="26" width="264" height="158" rx="18" fill="none" stroke="#94a3b8" stroke-width="9"/>
  <!-- label with a record dot -->
  <rect x="56" y="48" width="208" height="36" rx="8" fill="none" stroke="#94a3b8" stroke-width="6"/>
  <circle cx="82" cy="66" r="9" fill="#f38ba8"/>
  <line x1="106" y1="66" x2="240" y2="66" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
  <!-- tape window with two reels -->
  <rect x="74" y="106" width="172" height="56" rx="28" fill="none" stroke="#94a3b8" stroke-width="6"/>
  <g stroke="#94e2d5" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="110" cy="134" r="16"/>
    <circle cx="210" cy="134" r="16"/>
    <path d="M110 134 v-9 M110 134 l7.8 4.5 M110 134 l-7.8 4.5"/>
    <path d="M210 134 v-9 M210 134 l7.8 4.5 M210 134 l-7.8 4.5"/>
