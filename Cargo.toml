[workspace]
resolver = "2"
members = [
    "crates/nastro-config",
    "crates/nastro-records",
    "crates/nastro-record",
    "crates/nastro-audio",
    "crates/nastro-tui",
    "bin/nastro",
    "bin/nastro-tap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Spry Dynamics, LLC", "Tab Fitts"]
repository = "https://dev.azure.com/sprydynamics/oss-tools/_git/nastro-rs"
rust-version = "1.88"

[workspace.dependencies]
nastro-config = { path = "crates/nastro-config" }
nastro-records = { path = "crates/nastro-records" }
nastro-record = { path = "crates/nastro-record" }
nastro-audio = { path = "crates/nastro-audio" }
nastro-tui = { path = "crates/nastro-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
sysinfo = "0.33"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs4 = { version = "1", features = ["sync"] }
ctrlc = { version = "3", features = ["termination"] }
ratatui = "0.30"
trash = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
