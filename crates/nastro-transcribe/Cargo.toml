[package]
name = "nastro-transcribe"
description = "On-device speech-to-text for nastro recordings (embedded whisper.cpp via whisper-rs)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nastro-config.workspace = true
nastro-records.workspace = true
thiserror.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
sysinfo.workspace = true
sha2 = "0.11"
ureq = "3"
log = "0.4"
# `log_backend` routes whisper.cpp/ggml's (very chatty) stderr output through the `log` facade, where it is
# dropped because nastro installs no logger. `raw-api` exposes the C callback types, used instead of the
# "safe" callback setters (see the note in engine.rs).
whisper-rs = { version = "0.16", features = ["log_backend", "raw-api"] }

[target.'cfg(unix)'.dependencies]
# Cancelling a speaker-identification run must kill the whole process group, not just the launcher.
nix = { version = "0.29", features = ["signal", "process"] }

# A tiny stand-in for the `whisperx` command, used only by this crate's tests (never shipped).
[[bin]]
name = "nastro-fake-whisperx"
path = "src/bin/fake_whisperx.rs"
test = false
doc = false
