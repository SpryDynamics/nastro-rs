trigger:
  branches:
    include:
      - main
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - main

stages:
  - stage: Build
    jobs:
      - job: BuildTestLint
        strategy:
          matrix:
            Windows:
              imageName: windows-latest
            Linux:
              imageName: ubuntu-latest
        pool:
          vmImage: $(imageName)
        steps:
          - script: |
              rustup component add clippy rustfmt
            displayName: Install clippy/rustfmt components

          - script: |
              sudo apt-get update
              sudo apt-get install -y libpulse-dev
            displayName: Install libpulse-dev (Linux audio backend link dependency)
            condition: eq(variables['imageName'], 'ubuntu-latest')

          # ffmpeg is a runtime dependency of nastro-tap (invoked as a subprocess, never
          # linked). Installed here so the encoder's real-ffmpeg round-trip test runs
          # instead of skipping itself.
          - script: sudo apt-get install -y ffmpeg
            displayName: Install ffmpeg (Linux)
            condition: eq(variables['imageName'], 'ubuntu-latest')

          - script: choco install ffmpeg -y --no-progress
            displayName: Install ffmpeg (Windows)
            condition: eq(variables['imageName'], 'windows-latest')
            continueOnError: true

          # Transcription embeds whisper.cpp, which is compiled from source: it needs CMake and libclang.
          - pwsh: ./eng/ci-native-deps.ps1
            displayName: Install native build tools (CMake, libclang)

          # The end-to-end transcription tests run a real (tiny, 75 MB) model on real speech. It is downloaded
          # and SHA-256-verified by nastro itself; the cache just avoids fetching it on every run.
          - task: Cache@2
            displayName: Cache the test speech model
            inputs:
              key: 'whisper-models | "$(Agent.OS)" | tiny.en | v1'
              path: $(Pipeline.Workspace)/whisper-models

          - script: cargo build --workspace --all-targets
            displayName: Build

          - script: cargo test --workspace
            displayName: Test
            env:
              # Fail (don't silently skip) if ffmpeg is missing, so the real-encoder
              # round trip is guaranteed to have run.
              NASTRO_REQUIRE_FFMPEG: "1"
              # Likewise for transcription: a real model, real ffmpeg, real speech, through the library, the
              # CLI and the TUI. Without these the tests would skip rather than fail.
              NASTRO_REQUIRE_WHISPER: "1"
              NASTRO_TEST_DOWNLOAD_MODEL: "1"
              NASTRO_MODEL_DIR: $(Pipeline.Workspace)/whisper-models

          - script: cargo clippy --workspace --all-targets -- -D warnings
            displayName: Clippy

          - script: cargo fmt --all -- --check
            displayName: Fmt check

  - stage: LicenseCompliance
    dependsOn: Build
    jobs:
      - job: CheckLicenses
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: cargo install cargo-deny --locked
            displayName: Install cargo-deny

          - pwsh: ./eng/check-licenses.ps1
            displayName: Dependency license/advisory allow-list check
