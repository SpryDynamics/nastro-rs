name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste recordings, transcripts, meeting names, API keys or other private
        content** - this issue is public. Issues are also copied into the maintainers' private tracker.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. nastro record ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: nastro version
      description: Output of `nastro --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 10, Windows 11, Linux (PulseAudio), Linux (PipeWire), Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output / logs
      description: Trim anything private first.
      render: shell
